<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-label="The ten storefront templates">
  <defs><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1e1e1e" flood-opacity="0.10"/></filter></defs>
  <rect width="1400" height="620" rx="24" fill="#faf8f6"/>
  <g font-family="Inter, 'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif">
    <!-- each card 244x238, 5 per row; x = 40 + i*268 -->
    <!-- row 1 -->
    <g filter="url(#s)">
      <rect x="40" y="40" width="244" height="230" rx="16" fill="#fff"/><rect x="308" y="40" width="244" height="230" rx="16" fill="#fff"/><rect x="576" y="40" width="244" height="230" rx="16" fill="#fff"/><rect x="844" y="40" width="244" height="230" rx="16" fill="#fff"/><rect x="1112" y="40" width="248" height="230" rx="16" fill="#fff"/>
      <rect x="40" y="330" width="244" height="230" rx="16" fill="#fff"/><rect x="308" y="330" width="244" height="230" rx="16" fill="#fff"/><rect x="576" y="330" width="244" height="230" rx="16" fill="#fff"/><rect x="844" y="330" width="244" height="230" rx="16" fill="#fff"/><rect x="1112" y="330" width="248" height="230" rx="16" fill="#fff"/>
    </g>
    <!-- previews -->
    <!-- 1 Spotlight -->
    <rect x="56" y="56" width="212" height="136" rx="10" fill="#fff3ec"/><rect x="72" y="72" width="180" height="46" rx="8" fill="#ff4f1f"/><rect x="72" y="128" width="54" height="50" rx="6" fill="#fff" stroke="#ffd9c7"/><rect x="134" y="128" width="54" height="50" rx="6" fill="#fff" stroke="#ffd9c7"/><rect x="196" y="128" width="56" height="50" rx="6" fill="#fff" stroke="#ffd9c7"/>
    <!-- 2 Clean list -->
    <g><rect x="324" y="56" width="212" height="136" rx="10" fill="#f6f7f9"/>
    <rect x="338" y="70" width="184" height="26" rx="6" fill="#fff"/><rect x="338" y="102" width="184" height="26" rx="6" fill="#fff"/><rect x="338" y="134" width="184" height="26" rx="6" fill="#fff"/><circle cx="352" cy="83" r="7" fill="#c9ced6"/><circle cx="352" cy="115" r="7" fill="#c9ced6"/><circle cx="352" cy="147" r="7" fill="#c9ced6"/><rect x="480" y="76" width="34" height="14" rx="7" fill="#111"/><rect x="480" y="108" width="34" height="14" rx="7" fill="#111"/><rect x="480" y="140" width="34" height="14" rx="7" fill="#111"/></g>
    <!-- 3 Guided steps -->
    <g><rect x="592" y="56" width="212" height="136" rx="10" fill="#eef2ff"/><circle cx="632" cy="86" r="11" fill="#4f46e5"/><circle cx="698" cy="86" r="11" fill="#c7cdf5"/><circle cx="764" cy="86" r="11" fill="#c7cdf5"/><path d="M643 86 H687 M709 86 H753" stroke="#c7cdf5" stroke-width="3"/><rect x="608" y="114" width="56" height="64" rx="6" fill="#fff"/><rect x="672" y="114" width="56" height="64" rx="6" fill="#fff"/><rect x="736" y="114" width="56" height="64" rx="6" fill="#fff"/></g>
    <!-- 4 Gift tray -->
    <g><rect x="860" y="56" width="212" height="136" rx="10" fill="#fbf1e4"/><rect x="876" y="74" width="180" height="100" rx="10" fill="#e9d2b1"/><rect x="886" y="84" width="50" height="38" rx="6" fill="#fffaf2"/><rect x="942" y="84" width="50" height="38" rx="6" fill="#fffaf2"/><rect x="998" y="84" width="48" height="38" rx="6" fill="#fffaf2"/><rect x="886" y="128" width="78" height="36" rx="6" fill="#fffaf2"/><rect x="970" y="128" width="76" height="36" rx="6" fill="#fffaf2"/><rect x="950" y="64" width="12" height="20" fill="#c2410c"/></g>
    <!-- 5 Color block -->
    <g><rect x="1128" y="56" width="216" height="136" rx="10" fill="#fff"/><rect x="1128" y="56" width="108" height="68" rx="10" fill="#ffd400"/><rect x="1236" y="56" width="108" height="68" fill="#ff4f1f"/><rect x="1128" y="124" width="108" height="68" fill="#2fa860"/><rect x="1236" y="124" width="108" height="68" rx="10" fill="#5b6cff"/></g>
    <!-- 6 Pastel -->
    <g><rect x="56" y="346" width="212" height="136" rx="10" fill="#fdf2f8"/><rect x="72" y="362" width="56" height="64" rx="12" fill="#fbcfe8"/><rect x="136" y="362" width="56" height="64" rx="12" fill="#bae6fd"/><rect x="200" y="362" width="52" height="64" rx="12" fill="#d9f99d"/><rect x="72" y="436" width="180" height="32" rx="16" fill="#f472b6"/></g>
    <!-- 7 Editorial -->
    <g><rect x="324" y="346" width="212" height="136" rx="10" fill="#fff" stroke="#e5e0d8"/><rect x="340" y="362" width="120" height="12" rx="3" fill="#1e1e1e"/><rect x="340" y="382" width="80" height="6" rx="3" fill="#b9b2a8"/><rect x="340" y="404" width="56" height="62" fill="#e7e1d8"/><rect x="404" y="404" width="56" height="62" fill="#d8d0c4"/><rect x="468" y="404" width="52" height="62" fill="#e7e1d8"/></g>
    <!-- 8 Night -->
    <g><rect x="592" y="346" width="212" height="136" rx="10" fill="#10131a"/><rect x="608" y="362" width="56" height="64" rx="8" fill="#1c2230" stroke="#2c3550"/><rect x="672" y="362" width="56" height="64" rx="8" fill="#1c2230" stroke="#2c3550"/><rect x="736" y="362" width="56" height="64" rx="8" fill="#1c2230" stroke="#2c3550"/><rect x="608" y="438" width="184" height="30" rx="15" fill="#ffe100"/></g>
    <!-- 9 Split screen -->
    <g><rect x="860" y="346" width="212" height="136" rx="10" fill="#f6f7f9"/><rect x="872" y="358" width="124" height="112" rx="8" fill="#fff"/><rect x="1004" y="358" width="56" height="112" rx="8" fill="#1e1e1e"/><rect x="882" y="368" width="34" height="34" rx="6" fill="#e5e7eb"/><rect x="922" y="368" width="34" height="34" rx="6" fill="#e5e7eb"/><rect x="962" y="368" width="26" height="34" rx="6" fill="#e5e7eb"/><rect x="882" y="410" width="34" height="34" rx="6" fill="#e5e7eb"/><rect x="922" y="410" width="34" height="34" rx="6" fill="#e5e7eb"/><rect x="1012" y="454" width="40" height="8" rx="4" fill="#ff4f1f"/></g>
    <!-- 10 Compact card -->
    <g><rect x="1128" y="346" width="216" height="136" rx="10" fill="#f6f7f9"/><rect x="1142" y="360" width="88" height="48" rx="8" fill="#fff"/><rect x="1240" y="360" width="90" height="48" rx="8" fill="#fff"/><rect x="1142" y="416" width="88" height="48" rx="8" fill="#fff"/><rect x="1240" y="416" width="90" height="48" rx="8" fill="#fff"/><circle cx="1158" cy="384" r="9" fill="#ff4f1f"/><circle cx="1256" cy="384" r="9" fill="#ffd400"/><circle cx="1158" cy="440" r="9" fill="#2fa860"/><circle cx="1256" cy="440" r="9" fill="#5b6cff"/></g>

    <g font-size="17" font-weight="800" fill="#1e1e1e" letter-spacing="-0.2">
      <text x="56" y="224">Spotlight</text><text x="324" y="224">Clean list</text><text x="592" y="224">Guided steps</text><text x="860" y="224">Gift tray</text><text x="1128" y="224">Color block</text>
      <text x="56" y="514">Pastel</text><text x="324" y="514">Editorial</text><text x="592" y="514">Night</text><text x="860" y="514">Split screen</text><text x="1128" y="514">Compact card</text>
    </g>
    <g font-size="13" fill="#8a847f">
      <text x="56" y="246">Hero-led, bold and default</text><text x="324" y="246">Quiet rows, fast to scan</text><text x="592" y="246">One step at a time</text><text x="860" y="246">Slots in a gift tray</text><text x="1128" y="246">Big colour tiles</text>
      <text x="56" y="536">Soft and friendly</text><text x="324" y="536">Magazine-style type</text><text x="592" y="536">Dark and high-contrast</text><text x="860" y="536">Products + sticky box</text><text x="1128" y="536">Dense, small catalogs</text>
    </g>
  </g>
</svg>
