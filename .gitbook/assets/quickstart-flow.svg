<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 300" role="img" aria-label="The four steps from product selection to publishing a box">
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e1e1e" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1400" height="300" rx="24" fill="#faf8f6"/>
  <g font-family="Inter, 'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif">
    <path d="M300 150 H340 M640 150 H680 M980 150 H1020" stroke="#d9d2cc" stroke-width="2.5" stroke-dasharray="3 7" stroke-linecap="round"/>
    <g filter="url(#s)">
      <rect x="40" y="50" width="260" height="200" rx="18" fill="#fff"/>
      <rect x="380" y="50" width="260" height="200" rx="18" fill="#fff"/>
      <rect x="720" y="50" width="260" height="200" rx="18" fill="#fff"/>
      <rect x="1060" y="50" width="300" height="200" rx="18" fill="#fff"/>
    </g>
    <g font-size="13" font-weight="800" fill="#fff">
      <circle cx="76" cy="90" r="16" fill="#ff4a12"/><text x="76" y="95" text-anchor="middle">1</text>
      <circle cx="416" cy="90" r="16" fill="#ff4a12"/><text x="416" y="95" text-anchor="middle">2</text>
      <circle cx="756" cy="90" r="16" fill="#ff4a12"/><text x="756" y="95" text-anchor="middle">3</text>
      <circle cx="1096" cy="90" r="16" fill="#1e1e1e"/><text x="1096" y="95" text-anchor="middle">4</text>
    </g>
    <g font-size="22" font-weight="800" fill="#1e1e1e" letter-spacing="-0.4">
      <text x="64" y="144">Products</text>
      <text x="404" y="144">Discounts</text>
      <text x="744" y="144">Design</text>
      <text x="1084" y="144">Publish</text>
    </g>
    <g font-size="14.5" fill="#6b6460">
      <text x="64" y="172">Choose what shoppers</text><text x="64" y="193">can put in the box.</text>
      <text x="404" y="172">Pick a campaign type</text><text x="404" y="193">and set your rules.</text>
      <text x="744" y="172">Choose a template and</text><text x="744" y="193">match your brand.</text>
      <text x="1084" y="172">Add it to a page with a</text><text x="1084" y="193">block or shortcode.</text>
    </g>
    <g font-size="12" font-weight="700" letter-spacing="0.6">
      <rect x="64" y="212" width="96" height="24" rx="12" fill="#fff1ea"/><text x="112" y="228" text-anchor="middle" fill="#c2410c">≈ 2 MIN</text>
      <rect x="404" y="212" width="96" height="24" rx="12" fill="#fff1ea"/><text x="452" y="228" text-anchor="middle" fill="#c2410c">≈ 1 MIN</text>
      <rect x="744" y="212" width="96" height="24" rx="12" fill="#fff1ea"/><text x="792" y="228" text-anchor="middle" fill="#c2410c">≈ 2 MIN</text>
      <rect x="1084" y="212" width="96" height="24" rx="12" fill="#e8f7ec"/><text x="1132" y="228" text-anchor="middle" fill="#00701b">LIVE ✓</text>
    </g>
