        <g transform="translate(21 575) scale(0.26)"><ellipse cx="50" cy="88" rx="32" ry="4" fill="#000" opacity=".08"/>
    <circle cx="40" cy="58" r="28" fill="#d99a58"/><circle cx="40" cy="58" r="28" fill="none" stroke="#c0803f" stroke-width="2"/>
    <circle cx="30" cy="50" r="4" fill="#5a3520"/><circle cx="46" cy="44" r="4.5" fill="#5a3520"/><circle cx="50" cy="64" r="4" fill="#5a3520"/><circle cx="32" cy="68" r="3.5" fill="#5a3520"/><circle cx="58" cy="54" r="3" fill="#5a3520"/>
    <circle cx="66" cy="36" r="22" fill="#e6ae6e"/><circle cx="66" cy="36" r="22" fill="none" stroke="#cf9150" stroke-width="2"/>
    <circle cx="58" cy="30" r="3.5" fill="#6a4026"/><circle cx="72" cy="28" r="3" fill="#6a4026"/><circle cx="68" cy="44" r="3.5" fill="#6a4026"/></g><text x="56" y="592">Honey oat cookies</text><rect x="260" y="582" width="560" height="10" rx="5" fill="#f0f0f0"/><rect x="260" y="582" width="500" height="10" rx="5" fill="#ff4a12"/><text x="1030" y="592" text-anchor="end" fill="#757575">318 picks</text>
        <g transform="translate(21 607) scale(0.26)"><ellipse cx="50" cy="88" rx="30" ry="4" fill="#000" opacity=".08"/>
    <g transform="rotate(-8 50 52)"><rect x="20" y="16" width="60" height="72" rx="7" fill="#43251a"/>
    <path d="M20 40 H80 M20 64 H80 M40 16 V88 M60 16 V88" stroke="#5b3626" stroke-width="2"/>
    <rect x="20" y="62" width="60" height="26" rx="7" fill="#c9a24b"/><rect x="20" y="62" width="60" height="8" fill="#c9a24b"/>
    <text x="50" y="80" text-anchor="middle" font-size="9" font-weight="800" fill="#43251a" letter-spacing="1" font-family="Inter, 'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif">70% CACAO</text></g></g><text x="56" y="624">Dark Chocolate Bar</text><rect x="260" y="614" width="560" height="10" rx="5" fill="#f0f0f0"/><rect x="260" y="614" width="400" height="10" rx="5" fill="#ff4a12" fill-opacity="0.85"/><text x="1030" y="624" text-anchor="end" fill="#757575">254 picks</text>
        <g transform="translate(21 639) scale(0.26)"><ellipse cx="50" cy="90" rx="26" ry="4" fill="#000" opacity=".08"/>
    <rect x="26" y="24" width="48" height="64" rx="7" fill="#2f7a66"/><rect x="26" y="24" width="14" height="64" rx="7" fill="#3a8e78"/>
    <rect x="23" y="14" width="54" height="14" rx="5" fill="#215a4b"/><rect x="23" y="14" width="54" height="4" rx="2" fill="#2d7260"/>
    <ellipse cx="52" cy="58" rx="17" ry="20" fill="#f7f0e0"/>
    <path d="M52 44 C42 52 44 66 52 72 C60 66 62 52 52 44 Z" fill="#2f7a66"/><path d="M52 48 V70" stroke="#f7f0e0" stroke-width="1.5"/></g><text x="56" y="656">Jasmine Tea Tin</text><rect x="260" y="646" width="560" height="10" rx="5" fill="#f0f0f0"/><rect x="260" y="646" width="310" height="10" rx="5" fill="#ff4a12" fill-opacity="0.7"/><text x="1030" y="656" text-anchor="end" fill="#757575">196 picks</text>
        <g transform="translate(21 671) scale(0.26)"><ellipse cx="50" cy="88" rx="28" ry="4" fill="#000" opacity=".08"/>
    <rect x="24" y="30" width="52" height="56" rx="12" fill="#f2a516"/><rect x="24" y="30" width="52" height="14" rx="8" fill="#f7bf4a"/>
    <rect x="28" y="16" width="44" height="16" rx="5" fill="#7a4b22"/><rect x="28" y="16" width="44" height="5" rx="3" fill="#9a6431"/>
    <rect x="32" y="50" width="36" height="26" rx="5" fill="#fffaf0"/><circle cx="50" cy="60" r="5" fill="#f2a516"/><rect x="38" y="68" width="24" height="3" rx="1.5" fill="#c9b79a"/>
    <path d="M30 34 q4 14 2 22" stroke="#fff" stroke-opacity=".5" stroke-width="3" fill="none" stroke-linecap="round"/></g><text x="56" y="688">Wildflower Honey</text><rect x="260" y="678" width="560" height="10" rx="5" fill="#f0f0f0"/><rect x="260" y="678" width="220" height="10" rx="5" fill="#ff4a12" fill-opacity="0.55"/><text x="1030" y="688" text-anchor="end" fill="#757575">139 picks</text>
      </g>
    </g>
  </g>
