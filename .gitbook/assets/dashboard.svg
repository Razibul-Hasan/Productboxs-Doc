<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 890" role="img" aria-label="ProductBoxes dashboard in WordPress admin">
  <defs><filter id="s" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#1e1e1e" flood-opacity="0.18"/></filter></defs>
  <rect width="1400" height="890" rx="24" fill="#f3eee9"/>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" filter="url(#s)">
    <rect x="50" y="40" width="1300" height="810" rx="14" fill="#f0f0f1"/>
    <!-- browser bar -->
    <rect x="50" y="40" width="1300" height="44" rx="14" fill="#fff"/><rect x="50" y="70" width="1300" height="14" fill="#fff"/>
    <circle cx="78" cy="62" r="6" fill="#ff5f57"/><circle cx="98" cy="62" r="6" fill="#febc2e"/><circle cx="118" cy="62" r="6" fill="#28c840"/>
    <rect x="460" y="50" width="480" height="24" rx="12" fill="#f0f0f1"/><text x="700" y="67" text-anchor="middle" font-size="12" fill="#757575">yourstore.com/wp-admin/admin.php?page=productboxes</text>
    <!-- WP sidebar -->
    <rect x="50" y="84" width="170" height="766" fill="#1d2327"/><rect x="50" y="84" width="170" height="736" rx="0" fill="#1d2327"/>
    <g font-size="13" fill="#c3c4c7">
      <text x="72" y="124">Dashboard</text><text x="72" y="158">Posts</text><text x="72" y="192">WooCommerce</text><text x="72" y="226">Products</text>
      <rect x="50" y="246" width="170" height="34" fill="#2c3338"/><rect x="50" y="246" width="3" height="34" fill="#ff4a12"/><text x="72" y="268" fill="#fff" font-weight="600">ProductBoxes</text>
      <text x="92" y="304" fill="#fff" font-size="12.5" font-weight="600">Dashboard</text><text x="92" y="328" font-size="12.5">Boxes</text><text x="92" y="352" font-size="12.5">Analytics</text><text x="92" y="376" font-size="12.5">Settings</text>
      <text x="72" y="418">Appearance</text><text x="72" y="452">Plugins</text>
    </g>
    <!-- content -->
    <g transform="translate(250 112)">
      <text x="0" y="22" font-size="26" font-weight="700" fill="#1e1e1e" letter-spacing="-0.4">Dashboard</text>
      <text x="0" y="46" font-size="13.5" fill="#757575">How your boxes did in the last 30 days.</text>
      <rect x="920" y="2" width="130" height="38" rx="6" fill="#ff4a12"/><text x="985" y="26" text-anchor="middle" font-size="13.5" font-weight="600" fill="#fff">+ Create box</text>

      <!-- stat cards -->
      <g>
        <rect y="76" width="256" height="104" rx="8" fill="#fff" stroke="#e0e0e0"/><text x="20" y="104" font-size="12.5" fill="#757575">Revenue from boxes</text><text x="20" y="146" font-size="32" font-weight="700" fill="#1e1e1e">$4,820</text><text x="20" y="166" font-size="12" font-weight="600" fill="#008a20">▲ 18% vs previous</text>
        <rect x="272" y="76" width="256" height="104" rx="8" fill="#fff" stroke="#e0e0e0"/><text x="292" y="104" font-size="12.5" fill="#757575">Boxes sold</text><text x="292" y="146" font-size="32" font-weight="700" fill="#1e1e1e">142</text><text x="292" y="166" font-size="12" font-weight="600" fill="#008a20">▲ 9% vs previous</text>
        <rect x="544" y="76" width="256" height="104" rx="8" fill="#fff" stroke="#e0e0e0"/><text x="564" y="104" font-size="12.5" fill="#757575">Average box value</text><text x="564" y="146" font-size="32" font-weight="700" fill="#1e1e1e">$33.94</text><text x="564" y="166" font-size="12" font-weight="600" fill="#008a20">▲ 6% vs previous</text>
        <rect x="816" y="76" width="234" height="104" rx="8" fill="#fff" stroke="#e0e0e0"/><text x="836" y="104" font-size="12.5" fill="#757575">Builder conversion</text><text x="836" y="146" font-size="32" font-weight="700" fill="#1e1e1e">12.4%</text><text x="836" y="166" font-size="12" font-weight="600" fill="#8a4d00">▼ 1% vs previous</text>
      </g>

      <!-- chart -->
      <rect y="204" width="640" height="300" rx="8" fill="#fff" stroke="#e0e0e0"/>
      <text x="20" y="234" font-size="15" font-weight="600" fill="#1e1e1e">Revenue from boxes, daily</text>
      <g stroke="#f0f0f0"><path d="M20 290 H620 M20 340 H620 M20 390 H620 M20 440 H620"/></g>
      <path d="M20 430 C70 410 90 400 130 392 S200 360 240 372 S320 330 360 320 S440 300 480 280 S560 270 620 250 V470 H20 Z" fill="#ff4a12" fill-opacity="0.10"/>
      <path d="M20 430 C70 410 90 400 130 392 S200 360 240 372 S320 330 360 320 S440 300 480 280 S560 270 620 250" fill="none" stroke="#ff4a12" stroke-width="3" stroke-linecap="round"/>
      <circle cx="620" cy="250" r="6" fill="#fff" stroke="#ff4a12" stroke-width="3"/>

