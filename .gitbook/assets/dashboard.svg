      <rect x="664" y="204" width="386" height="300" rx="8" fill="#fff" stroke="#e0e0e0"/>
      <text x="684" y="234" font-size="15" font-weight="600" fill="#1e1e1e">Finish setting up</text>
      <rect x="684" y="248" width="346" height="6" rx="3" fill="#f0f0f0"/><rect x="684" y="248" width="173" height="6" rx="3" fill="#ff4a12"/>
      <g font-size="13.5" fill="#1e1e1e">
        <circle cx="694" cy="288" r="10" fill="#008a20"/><path d="M689 288 l4 4 l7 -8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><text x="716" y="293">Name your box</text>
        <circle cx="694" cy="332" r="10" fill="#008a20"/><path d="M689 332 l4 4 l7 -8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><text x="716" y="337">Choose what shoppers can pick</text>
        <circle cx="694" cy="376" r="10" fill="none" stroke="#c3c4c7" stroke-width="2"/><text x="716" y="381" font-weight="600">Put it on a page</text><text x="716" y="399" font-size="12" fill="#757575">So shoppers can find it.</text>
        <circle cx="694" cy="432" r="10" fill="none" stroke="#c3c4c7" stroke-width="2"/><text x="716" y="437" font-weight="600">Place a test order</text><text x="716" y="455" font-size="12" fill="#757575">Check the price and the cart line.</text>
      </g>

